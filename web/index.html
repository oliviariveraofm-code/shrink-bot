<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>The Shrink — The Trading Floor</title>
    <meta name="description" content="The Shrink. The 5th Agent of the Trading Floor. It does not predict. It diagnoses." />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main class="hero">
        <header class="hero__eyebrow" data-reveal>
          <span class="eyebrow__line" aria-hidden="true"></span>
          <span>The 5th Agent of the Trading Floor</span>
        </header>

        <h1 class="hero__title" data-reveal>THE SHRINK</h1>

        <p class="hero__subtitle" data-reveal>
          Emotion is expensive.<br />Discipline is engineered.
        </p>

        <a class="hero__cta" href="#" data-reveal>
          <span>Enter the Floor</span>
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
            <path d="M11.5 1L17 6L11.5 11" stroke="currentColor" stroke-width="1.4" />
            <path d="M17 6H0.5" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </a>

        <div class="hero__scroll" data-reveal aria-hidden="true">
          <span>Scroll</span>
          <i></i>
        </div>
      </main>

      <div class="loader" id="loader">
        <span class="loader__mark">S</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
